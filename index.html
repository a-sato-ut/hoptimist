<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#f5f1e8" />
  <title>Hoptimist Play</title>
  <style>
    :root {
      --toy: #86d6ff;
      --toy-hi: #d8f4ff;
      --toy-shadow: #53b6e4;
      --spring: var(--toy);
      --ink: #242424;
      --bg: #f5f1e8;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      font-family: ui-rounded, "SF Pro Rounded", "Hiragino Sans", system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      min-height: 100dvh;
    }

    main {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      background:
        radial-gradient(circle at 50% 31%, rgba(255,255,255,.92) 0 13%, rgba(255,255,255,.35) 32%, transparent 56%),
        var(--bg);
    }

    .ui {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      z-index: 10;
      display: grid;
      justify-items: end;
      gap: 12px;
      pointer-events: none;
    }

    .ui > * {
      pointer-events: auto;
    }

    .settingsButton {
      width: 52px;
      height: 52px;
      border: 0;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.8);
      box-shadow:
        0 14px 30px rgba(92, 76, 53, .16),
        inset 0 1px 0 rgba(255,255,255,.72);
      color: var(--ink);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .settingsButton:hover {
      transform: translateY(-1px);
      box-shadow:
        0 16px 34px rgba(92, 76, 53, .2),
        inset 0 1px 0 rgba(255,255,255,.8);
    }

    .settingsButton:active {
      transform: translateY(0);
    }

    .settingsButton:focus-visible,
    .swatch:focus-visible {
      outline: 3px solid rgba(36, 36, 36, .16);
      outline-offset: 3px;
    }

    .settingsButton svg {
      width: 24px;
      height: 24px;
    }

    .settingsPanel {
      width: min(228px, calc(100vw - 32px));
      padding: 18px;
      border-radius: 24px;
      background: rgba(255,255,255,.82);
      box-shadow:
        0 24px 44px rgba(92, 76, 53, .18),
        inset 0 1px 0 rgba(255,255,255,.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--ink);
      opacity: 0;
      transform: translateY(-8px) scale(.98);
      transform-origin: top right;
      pointer-events: none;
      transition: opacity .22s ease, transform .22s ease;
    }

    .settingsPanel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .settingsTitle {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .settingsGroup + .settingsGroup {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(36, 36, 36, .08);
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      gap: 12px;
      justify-content: center;
    }

    .swatch {
      border: 0;
      width: 52px;
      height: 52px;
      border-radius: 999px;
      padding: 4px;
      display: grid;
      place-items: center;
      background: transparent;
      box-shadow: none;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .swatch:hover {
      transform: translateY(-1px) scale(1.04);
      background: rgba(255,255,255,.7);
      box-shadow:
        0 10px 20px rgba(92, 76, 53, .1);
    }

    .swatch.is-selected {
      background: rgba(255,255,255,.94);
      box-shadow:
        inset 0 0 0 2px rgba(36,36,36,.88),
        0 12px 24px rgba(92, 76, 53, .12);
    }

    .swatchColor {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,.36),
        inset 0 -10px 20px rgba(0,0,0,.08);
    }

    .flagSwatch--none {
      background: #ffffff;
      box-shadow:
        inset 0 0 0 1.5px rgba(36,36,36,.12),
        inset 0 2px 4px rgba(255,255,255,.5),
        inset 0 -8px 16px rgba(0,0,0,.05);
    }

    .flagSwatch--denmark {
      background:
        linear-gradient(#ffffff, #ffffff) 36% 50% / 16% 100% no-repeat,
        linear-gradient(#ffffff, #ffffff) 50% 50% / 100% 16% no-repeat,
        #c91726;
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,.22),
        inset 0 -10px 20px rgba(0,0,0,.12);
    }

    /* 10個目の「木目」を最終行の中央に置く */
    .swatch:last-child:nth-child(3n + 1) {
      grid-column: 2;
    }

    /*
     * Wood material
     *
     * 通常カラーでは plastic / plasticSoft をそのまま使用し、
     * 木目テーマのときだけ SVG 内の塗りを woodGrain に差し替える。
     */
    #toySvg.is-wood [fill="url(#plastic)"] {
      fill: url(#woodGrain);
    }

    #toySvg.is-wood [fill="url(#plasticSoft)"] {
      fill: url(#woodGrainSoft);
    }

    #toySvg.is-wood [fill="var(--toy-hi)"] {
      fill: url(#woodGrainSoft);
    }

    /* プラスチック特有の強いハイライトを木製時は控えめに */
    #toySvg.is-wood #headVisual > path[fill="none"] {
      stroke-opacity: .04;
    }

    #toySvg.is-wood #headVisual circle[fill="white"] {
      opacity: .08;
    }

    #toySvg.is-wood #base > ellipse[fill="white"] {
      fill: #f3e2c4;
      opacity: .14;
    }

    .woodForm {
      opacity: 0;
      pointer-events: none;
      transition: opacity .24s ease;
    }

    #toySvg.is-wood .woodForm {
      opacity: 1;
    }

    .woodFormShade {
      mix-blend-mode: multiply;
    }

    .woodFormHi {
      mix-blend-mode: screen;
    }

    .stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    svg {
      width: min(88vw, 560px);
      max-height: 88dvh;
      height: auto;
      overflow: visible;
      touch-action: none;
    }

    #toySvg * {
      transition: fill .24s ease, stroke .24s ease, stop-color .24s ease;
    }

    #headHit {
      cursor: grab;
      touch-action: none;
    }

    #headHit.dragging { cursor: grabbing; }

    #leftFlagHit,
    #rightFlagHit {
      cursor: grab;
      touch-action: none;
    }

    #leftFlagHit.dragging,
    #rightFlagHit.dragging { cursor: grabbing; }

    #toySvg:not(.has-flag) #flagRig { display: none; }

    .shadow {
      transform-origin: center;
      transition: opacity .1s linear;
    }

  </style>
</head>

<body>
<main id="app">
  <div class="ui">
    <button id="settingsButton" class="settingsButton" type="button" aria-expanded="false" aria-controls="settingsPanel" aria-label="設定を開く">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.25"/>
        <path d="M12 2.75v2.1M12 19.15v2.1M4.75 12h2.1M17.15 12h2.1M5.99 5.99l1.48 1.48M16.53 16.53l1.48 1.48M5.99 18.01l1.48-1.48M16.53 7.47l1.48-1.48"/>
        <path d="M12 5.65a6.35 6.35 0 1 1 0 12.7a6.35 6.35 0 0 1 0-12.7Z"/>
      </svg>
    </button>

    <section id="settingsPanel" class="settingsPanel" aria-label="色と旗の設定" hidden>
      <div class="settingsGroup">
        <h2 class="settingsTitle">Color</h2>
        <div id="swatches" class="swatches" role="list"></div>
      </div>
      <div class="settingsGroup">
        <h2 class="settingsTitle">Flag</h2>
        <div id="flagOptions" class="swatches" role="list"></div>
      </div>
    </section>
  </div>

  <div class="stage">
    <svg id="toySvg" viewBox="0 0 400 600" role="img" aria-label="ばねで跳ねるHoptimist風のおもちゃ">
      <defs>
        <linearGradient id="plastic" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="var(--toy-hi)"/>
          <stop offset=".42" stop-color="var(--toy)"/>
          <stop offset="1" stop-color="var(--toy-shadow)"/>
        </linearGradient>

        <linearGradient id="plasticSoft" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--toy-hi)"/>
          <stop offset="1" stop-color="var(--toy)"/>
        </linearGradient>

        <!--
          Wood texture.
          添付写真のオーク材っぽい、明るい縦木目をイメージ。
          patternUnits="userSpaceOnUse" にすることで、
          パーツごとに木目サイズが変わりすぎないようにする。
        -->
        <linearGradient id="woodBase" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#c89e70"/>
          <stop offset=".18" stop-color="#dfbd91"/>
          <stop offset=".43" stop-color="#d0a778"/>
          <stop offset=".67" stop-color="#e3c397"/>
          <stop offset="1" stop-color="#bd8e60"/>
        </linearGradient>

        <linearGradient id="woodBaseSoft" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#d6af80"/>
          <stop offset=".25" stop-color="#efd0a4"/>
          <stop offset=".55" stop-color="#ddb88a"/>
          <stop offset=".8" stop-color="#eccb9d"/>
          <stop offset="1" stop-color="#c99d6e"/>
        </linearGradient>

        <pattern id="woodGrain"
                 width="36"
                 height="120"
                 patternUnits="userSpaceOnUse">
          <rect width="36" height="120" fill="url(#woodBase)"/>

          <!-- dark grain -->
          <path
            d="M4 -12
               C1 11 8 24 5 46
               C2 67 8 85 4 108
               C2 121 3 130 5 138

               M13 -10
               C17 12 10 29 14 50
               C18 71 11 88 15 110
               C17 121 16 130 14 138

               M27 -12
               C23 9 30 27 26 47
               C22 68 30 87 26 109
               C24 122 25 131 27 138"
            fill="none"
            stroke="#805c3d"
            stroke-width="1.15"
            stroke-opacity=".26"
            stroke-linecap="round"/>

          <!-- thin grain -->
          <path
            d="M8 -5
               C11 15 6 34 9 54
               C12 75 7 94 10 125

               M20 -8
               C17 15 23 32 20 56
               C17 79 23 98 20 128

               M32 -5
               C35 17 30 39 33 61
               C35 83 31 101 34 126"
            fill="none"
            stroke="#fff1d6"
            stroke-width=".8"
            stroke-opacity=".25"
            stroke-linecap="round"/>

          <!-- small irregular grain -->
          <path
            d="M1 30 C8 26 8 37 1 41
               M22 74 C29 68 31 80 23 85
               M8 95 C14 91 15 101 9 105"
            fill="none"
            stroke="#755236"
            stroke-width=".85"
            stroke-opacity=".18"
            stroke-linecap="round"/>
        </pattern>

        <pattern id="woodGrainSoft"
                 width="36"
                 height="120"
                 patternUnits="userSpaceOnUse">
          <rect width="36" height="120" fill="url(#woodBaseSoft)"/>

          <path
            d="M4 -12
               C1 11 8 24 5 46
               C2 67 8 85 4 108
               C2 121 3 130 5 138

               M14 -10
               C18 12 11 29 15 50
               C19 71 12 88 16 110
               C18 121 17 130 15 138

               M28 -12
               C24 9 31 27 27 47
               C23 68 31 87 27 109
               C25 122 26 131 28 138"
            fill="none"
            stroke="#916947"
            stroke-width="1"
            stroke-opacity=".2"
            stroke-linecap="round"/>

          <path
            d="M9 -5
               C12 15 7 34 10 54
               C13 75 8 94 11 125

               M21 -8
               C18 15 24 32 21 56
               C18 79 24 98 21 128"
            fill="none"
            stroke="#fff3dc"
            stroke-width=".8"
            stroke-opacity=".28"
            stroke-linecap="round"/>
        </pattern>

        <!--
          木目は平面パターンなので、球体らしい丸みは照明オーバーレイで足す。
          multiply で縁を落とし、screen で左上にハイライトを置く。
        -->
        <radialGradient id="woodDomeShade" gradientUnits="userSpaceOnUse"
                        cx="168" cy="168" r="168">
          <stop offset="0" stop-color="#fff8ee"/>
          <stop offset=".38" stop-color="#f0dcc0"/>
          <stop offset=".68" stop-color="#c49a72"/>
          <stop offset="1" stop-color="#5a3b26"/>
        </radialGradient>

        <radialGradient id="woodDomeHi" gradientUnits="userSpaceOnUse"
                        cx="154" cy="156" r="92">
          <stop offset="0" stop-color="#e8d5b4"/>
          <stop offset=".36" stop-color="#c4a07a"/>
          <stop offset="1" stop-color="#000"/>
        </radialGradient>

        <radialGradient id="woodBallShade" gradientUnits="objectBoundingBox"
                        cx=".34" cy=".28" r=".78">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset=".48" stop-color="#edd8b6"/>
          <stop offset="1" stop-color="#5c3d28"/>
        </radialGradient>

        <radialGradient id="woodBallHi" gradientUnits="objectBoundingBox"
                        cx=".3" cy=".26" r=".46">
          <stop offset="0" stop-color="#fffaf0"/>
          <stop offset=".4" stop-color="#e8cda8"/>
          <stop offset="1" stop-color="#000"/>
        </radialGradient>

        <linearGradient id="woodRingShade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff6ea"/>
          <stop offset=".4" stop-color="#e4c8a2"/>
          <stop offset="1" stop-color="#6a4a32"/>
        </linearGradient>

        <radialGradient id="woodTopShade" gradientUnits="objectBoundingBox"
                        cx=".42" cy=".32" r=".78">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset=".55" stop-color="#e6cba8"/>
          <stop offset="1" stop-color="#7a5538"/>
        </radialGradient>

        <radialGradient id="woodFootShade" gradientUnits="objectBoundingBox"
                        cx=".38" cy=".28" r=".8">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset=".5" stop-color="#e8d0b0"/>
          <stop offset="1" stop-color="#6e4c34"/>
        </radialGradient>

        <linearGradient id="woodStemShade" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#7a5538"/>
          <stop offset=".35" stop-color="#fff6ea"/>
          <stop offset="1" stop-color="#5c3d28"/>
        </linearGradient>

        <clipPath id="domeClip">
          <path d="M90 258
                   C90 168 136 104 200 104
                   C264 104 310 168 310 258
                   C310 288 288 306 256 306
                   L144 306
                   C112 306 90 288 90 258 Z"/>
        </clipPath>

        <filter id="softShadow" x="-50%" y="-100%" width="200%" height="300%">
          <feGaussianBlur stdDeviation="10"/>
        </filter>

        <filter id="noseShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity=".18"/>
        </filter>
      </defs>

      <!-- ground shadow -->
      <ellipse id="groundShadow" class="shadow"
        cx="200" cy="482" rx="86" ry="14"
        fill="#4f4738" opacity=".13" filter="url(#softShadow)"/>

      <!-- feet -->
      <g id="base">
        <rect x="143" y="414" width="18" height="30" rx="8" fill="url(#plasticSoft)"/>
        <rect x="239" y="414" width="18" height="30" rx="8" fill="url(#plasticSoft)"/>
        <rect class="woodForm woodFormShade" x="143" y="414" width="18" height="30" rx="8" fill="url(#woodStemShade)"/>
        <rect class="woodForm woodFormShade" x="239" y="414" width="18" height="30" rx="8" fill="url(#woodStemShade)"/>

        <g>
          <ellipse cx="144" cy="444" rx="35" ry="11" fill="url(#plasticSoft)"/>
          <ellipse class="woodForm woodFormShade" cx="144" cy="444" rx="35" ry="11" fill="url(#woodFootShade)"/>
        </g>

        <g>
          <ellipse cx="256" cy="444" rx="35" ry="11" fill="url(#plasticSoft)"/>
          <ellipse class="woodForm woodFormShade" cx="256" cy="444" rx="35" ry="11" fill="url(#woodFootShade)"/>
        </g>

        <!-- lower ring -->
        <path d="M126 383
                 C126 370 156 361 200 361
                 C244 361 274 370 274 383
                 L274 403
                 C274 416 244 425 200 425
                 C156 425 126 416 126 403
                 Z"
              fill="url(#plastic)"/>
        <path class="woodForm woodFormShade"
              d="M126 383
                 C126 370 156 361 200 361
                 C244 361 274 370 274 383
                 L274 403
                 C274 416 244 425 200 425
                 C156 425 126 416 126 403
                 Z"
              fill="url(#woodRingShade)"/>
        <ellipse cx="200" cy="383" rx="74" ry="14" fill="var(--toy-hi)" opacity=".96"/>
        <ellipse class="woodForm woodFormShade" cx="200" cy="383" rx="74" ry="14" fill="url(#woodTopShade)"/>
        <ellipse cx="200" cy="393" rx="60" ry="10" fill="white" opacity=".34"/>
      </g>

      <!-- spring, redrawn every frame -->
      <path id="springBack" fill="none" stroke="var(--toy-shadow)" stroke-width="5.5"
            stroke-linecap="round" stroke-linejoin="round" opacity=".16"/>
      <path id="spring" fill="none" stroke="var(--spring)" stroke-width="4.25"
            stroke-linecap="round" stroke-linejoin="round"/>

      <!-- moving head -->
      <g id="headGroup">
        <g id="headVisual">
          <rect x="191" y="86" width="18" height="38" rx="7" fill="url(#plasticSoft)"/>
          <rect class="woodForm woodFormShade" x="191" y="86" width="18" height="38" rx="7" fill="url(#woodStemShade)"/>

          <g id="flagRig" aria-hidden="true">
            <g id="leftFlagRig">
              <path id="leftFlagSpringBack" fill="none" stroke="#5e6167" stroke-width="3.8"
                    stroke-linecap="round" stroke-linejoin="round" opacity=".15"/>
              <path id="leftFlagSpring" fill="none" stroke="#8c9097" stroke-width="2.35"
                    stroke-linecap="round" stroke-linejoin="round"/>
              <g id="leftFlagTranslate">
                <g id="leftFlagGroup">
                  <rect x="-45" y="-54" width="84" height="54" rx="4.5" fill="#c91726"/>
                  <rect x="-18" y="-54" width="12" height="54" fill="#ffffff"/>
                  <rect x="-45" y="-31.5" width="84" height="12" fill="#ffffff"/>
                  <rect id="leftFlagHit" x="-55" y="-64" width="104" height="74" rx="14"
                        fill="transparent"/>
                </g>
              </g>
            </g>

            <g id="rightFlagRig">
              <path id="rightFlagSpringBack" fill="none" stroke="#5e6167" stroke-width="3.8"
                    stroke-linecap="round" stroke-linejoin="round" opacity=".15"/>
              <path id="rightFlagSpring" fill="none" stroke="#8c9097" stroke-width="2.35"
                    stroke-linecap="round" stroke-linejoin="round"/>
              <g id="rightFlagTranslate">
                <g id="rightFlagGroup">
                  <rect x="-39" y="-54" width="84" height="54" rx="4.5" fill="#c91726"/>
                  <rect x="-12" y="-54" width="12" height="54" fill="#ffffff"/>
                  <rect x="-39" y="-31.5" width="84" height="12" fill="#ffffff"/>
                  <rect id="rightFlagHit" x="-49" y="-64" width="104" height="74" rx="14"
                        fill="transparent"/>
                </g>
              </g>
            </g>
          </g>

          <!-- dome -->
          <path d="M90 258
                   C90 168 136 104 200 104
                   C264 104 310 168 310 258
                   C310 288 288 306 256 306
                   L144 306
                   C112 306 90 288 90 258 Z"
                fill="url(#plastic)"/>

          <path class="woodForm woodFormShade"
                d="M90 258
                   C90 168 136 104 200 104
                   C264 104 310 168 310 258
                   C310 288 288 306 256 306
                   L144 306
                   C112 306 90 288 90 258 Z"
                fill="url(#woodDomeShade)"/>

          <ellipse class="woodForm woodFormHi"
                   cx="154" cy="156" rx="78" ry="58"
                   fill="url(#woodDomeHi)"
                   fill-opacity=".42"
                   clip-path="url(#domeClip)"/>

          <!-- subtle plastic highlight -->
          <path d="M116 197
                   C131 145 164 118 206 114"
                fill="none" stroke="white" stroke-opacity=".34"
                stroke-width="14" stroke-linecap="round"/>

          <!-- eyes -->
          <ellipse cx="148" cy="228" rx="7" ry="15" fill="var(--ink)"/>
          <ellipse cx="252" cy="228" rx="7" ry="15" fill="var(--ink)"/>

          <!-- nose -->
          <circle cx="200" cy="250" r="22" fill="url(#plasticSoft)" filter="url(#noseShadow)"/>
          <circle class="woodForm woodFormShade" cx="200" cy="250" r="22" fill="url(#woodBallShade)"/>
          <circle class="woodForm woodFormHi" cx="200" cy="250" r="22" fill="url(#woodBallHi)"/>
          <circle cx="192" cy="242" r="6" fill="white" opacity=".2"/>
        </g>

        <!-- larger invisible hit area -->
        <rect id="headHit" x="70" y="82" width="260" height="240" rx="118"
              fill="transparent"/>
      </g>
    </svg>
  </div>
</main>

<script>
(() => {
  const root = document.documentElement;
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  const svg = document.getElementById('toySvg');
  const headGroup = document.getElementById('headGroup');
  const headHit = document.getElementById('headHit');
  const spring = document.getElementById('spring');
  const springBack = document.getElementById('springBack');
  const shadow = document.getElementById('groundShadow');
  const settingsButton = document.getElementById('settingsButton');
  const settingsPanel = document.getElementById('settingsPanel');
  const swatches = document.getElementById('swatches');
  const flagOptions = document.getElementById('flagOptions');

  const flagEls = {
    left: {
      translate: document.getElementById('leftFlagTranslate'),
      group: document.getElementById('leftFlagGroup'),
      spring: document.getElementById('leftFlagSpring'),
      springBack: document.getElementById('leftFlagSpringBack'),
      hit: document.getElementById('leftFlagHit')
    },
    right: {
      translate: document.getElementById('rightFlagTranslate'),
      group: document.getElementById('rightFlagGroup'),
      spring: document.getElementById('rightFlagSpring'),
      springBack: document.getElementById('rightFlagSpringBack'),
      hit: document.getElementById('rightFlagHit')
    }
  };

  const themes = {
    mizuiro: { label: '水色', toy: '#1fb3e5', hi: '#9deeff', shadow: '#0d8ab7' },
    yellow: { label: '黄色', toy: '#f5c41f', hi: '#ffe588', shadow: '#d39b00' },
    orange: { label: 'オレンジ', toy: '#f58a2f', hi: '#ffc07e', shadow: '#d85a12' },
    pink: { label: 'ピンク', toy: '#f3c5d8', hi: '#ffe8f1', shadow: '#da98b4' },
    green: { label: '緑', toy: '#52d33d', hi: '#a5f28d', shadow: '#2fa92c' },
    yellowgreen: { label: '黄緑', toy: '#b6d61b', hi: '#e8f586', shadow: '#879f09' },
    beige: { label: 'ベージュ', toy: '#efc9b1', hi: '#ffe8db', shadow: '#d5a58a' },
    red: { label: '赤', toy: '#ef4740', hi: '#ffaaa3', shadow: '#c92825' },
    usuao: { label: '薄い青色', toy: '#b8d8ff', hi: '#edf5ff', shadow: '#89add9' },

    wood: {
      label: '木目',
      toy: '#d2aa7a',
      hi: '#efd0a4',
      shadow: '#9c704b',
      spring: '#29231e',
      material: 'wood'
    }
  };
  const themeEntries = Object.entries(themes);
  const STORAGE_KEY = 'hoptimist-theme';
  const FLAG_STORAGE_KEY = 'hoptimist-flag';
  let currentTheme = null;
  let currentFlag = 'none';

  const flagChoices = {
    none: { label: 'なし' },
    denmark: { label: 'Denmark' }
  };

  // Spring state in SVG units.
  const state = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    ax: 0,
    ay: 0,
    throwVx: 0,
    throwVy: 0,
    angle: 0,
    omega: 0,
    alpha: 0,
    dragging: false,
    pointerId: null,
    lastPX: 0,
    lastPY: 0,
    lastT: 0,
    dragTarget: null,
    grabOffsetX: 0,
    grabOffsetY: 0,
    holdX: 0,
    holdY: 0
  };

  const headAnchor = { x: 200, y: 304 };
  const bodyAnchor = { x: 200, y: 388 };
  const HEAD_REST_Y = 52;
  const SPRING_TOP_OFFSET = 3;

  // Physical parameters.
  // state.v* and flag.v* are WORLD-SPACE velocities.
  // The flag displacement flag.{x,y} is relative to its rest point on the head.
  const HEAD_MASS = 1.0;
  const FLAG_MASS = 1.0;

  const KX = 3520;     // head <-> body spring stiffness
  const KY = 4560;
  const DAMP_X = 1.8;
  const DAMP_Y = 2.16;
  const MAX_X = 35;
  const MIN_Y = -125;
  const MIN_SPRING_LENGTH = 6;
  const MAX_Y = bodyAnchor.y - (headAnchor.y + HEAD_REST_Y + SPRING_TOP_OFFSET + MIN_SPRING_LENGTH);

  // Each flag spring uses exactly the same force with opposite signs on the
  // flag and the head. This makes the coupling passive instead of an
  // acceleration/velocity feedback loop that can create energy.
  const FLAG_KX = 1960;
  const FLAG_KY = 2380;
  const FLAG_DAMP_X = 1.72;
  const FLAG_DAMP_Y = 2.05;
  const FLAG_MAX_X = 34;
  const FLAG_MIN_Y = -52;
  const FLAG_MAX_Y = 30;

  // Fixed-step integration prevents variable requestAnimationFrame dt from
  // numerically pumping a stiff spring.
  const PHYSICS_DT = 1 / 240;
  const MAX_FRAME_DT = 0.05;

  const flags = {
    left: {
      ...flagEls.left,
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      throwVx: 0,
      throwVy: 0,
      angle: 0,
      dragging: false,
      anchorX: 152,
      anchorY: 126,
      restX: 114.4,
      restY: 76.4,
      baseAngle: 0
    },
    right: {
      ...flagEls.right,
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      throwVx: 0,
      throwVy: 0,
      angle: 0,
      dragging: false,
      anchorX: 248,
      anchorY: 126,
      restX: 285.6,
      restY: 76.4,
      baseAngle: 0
    }
  };

  let lastFrame = performance.now();
  let physicsAccumulator = 0;

  function clamp(v, a, b) {
    return Math.max(a, Math.min(b, v));
  }

  // Flag local +X is the bottom edge. Rotate so that edge stays perpendicular
  // to the spring from the head anchor to the flag pivot.
  function springToFlagAngle(anchorX, anchorY, pivotX, pivotY) {
    return Math.atan2(pivotX - anchorX, anchorY - pivotY) * 180 / Math.PI;
  }

  Object.values(flags).forEach((flag) => {
    flag.baseAngle = springToFlagAngle(flag.anchorX, flag.anchorY, flag.restX, flag.restY);
    flag.angle = flag.baseAngle;
  });

  function setTheme(name) {
    const theme = themes[name] || themes.mizuiro;
    currentTheme = name in themes ? name : 'mizuiro';

    root.style.setProperty('--toy', theme.toy);
    root.style.setProperty('--toy-hi', theme.hi);
    root.style.setProperty('--toy-shadow', theme.shadow);
    root.style.setProperty('--spring', theme.spring || theme.toy);

    svg.classList.toggle('is-wood', theme.material === 'wood');

    if (themeMeta) themeMeta.setAttribute('content', getComputedStyle(root).getPropertyValue('--bg').trim());
    localStorage.setItem(STORAGE_KEY, currentTheme);

    swatches.querySelectorAll('.swatch').forEach((button) => {
      const isSelected = button.dataset.theme === currentTheme;
      button.classList.toggle('is-selected', isSelected);
      button.setAttribute('aria-pressed', String(isSelected));
    });
  }

  function resetFlagMotion(flag) {
    flag.x = 0;
    flag.y = 0;
    flag.vx = 0;
    flag.vy = 0;
    flag.throwVx = 0;
    flag.throwVy = 0;
    flag.angle = flag.baseAngle;
    flag.dragging = false;
    flag.hit.classList.remove('dragging');
  }

  function setFlag(name) {
    currentFlag = name === 'denmark' ? 'denmark' : 'none';
    svg.classList.toggle('has-flag', currentFlag === 'denmark');
    localStorage.setItem(FLAG_STORAGE_KEY, currentFlag);

    if (currentFlag === 'none') {
      Object.values(flags).forEach(resetFlagMotion);

      if (state.dragTarget && state.dragTarget !== 'head') {
        state.dragTarget = null;
        state.pointerId = null;
      }
    }

    flagOptions.querySelectorAll('.swatch').forEach((button) => {
      const isSelected = button.dataset.flag === currentFlag;
      button.classList.toggle('is-selected', isSelected);
      button.setAttribute('aria-pressed', String(isSelected));
    });
  }

  function togglePanel(force) {
    const shouldOpen = typeof force === 'boolean' ? force : settingsPanel.hidden;
    settingsPanel.hidden = false;
    settingsPanel.classList.toggle('open', shouldOpen);
    settingsPanel.hidden = !shouldOpen;
    settingsButton.setAttribute('aria-expanded', String(shouldOpen));
    settingsButton.setAttribute('aria-label', shouldOpen ? '設定を閉じる' : '設定を開く');
  }

  function buildSwatches() {
    const fragment = document.createDocumentFragment();

    themeEntries.forEach(([name, theme]) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'swatch';
      button.dataset.theme = name;
      button.setAttribute('role', 'listitem');
      button.setAttribute('aria-label', `${theme.label}に変更`);

      const swatchStyle = theme.material === 'wood'
        ? `
          background:
            repeating-linear-gradient(
              96deg,
              rgba(112,76,46,.22) 0px,
              rgba(112,76,46,.22) 1px,
              transparent 1px,
              transparent 6px
            ),
            linear-gradient(
              145deg,
              ${theme.hi},
              ${theme.toy} 58%,
              ${theme.shadow}
            );
        `
        : `
          background:
            linear-gradient(
              145deg,
              ${theme.hi},
              ${theme.toy} 58%,
              ${theme.shadow}
            );
        `;

      button.innerHTML = `
        <span class="swatchColor" style="${swatchStyle}"></span>
      `;

      button.addEventListener('click', () => {
        setTheme(name);
      });

      fragment.appendChild(button);
    });

    swatches.appendChild(fragment);
  }

  function buildFlagOptions() {
    const fragment = document.createDocumentFragment();

    Object.keys(flagChoices).forEach((name) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'swatch';
      button.dataset.flag = name;
      button.setAttribute('role', 'listitem');
      button.setAttribute('aria-label', name === 'none' ? '旗なしに変更' : 'デンマーク旗を追加');

      button.innerHTML = `<span class="swatchColor flagSwatch--${name}"></span>`;

      button.addEventListener('click', () => {
        setFlag(name);
      });

      fragment.appendChild(button);
    });

    flagOptions.appendChild(fragment);
  }

  function screenToSvg(clientX, clientY) {
    const pt = svg.createSVGPoint();
    pt.x = clientX;
    pt.y = clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function constrainMotion() {
    if (state.x < -MAX_X) {
      state.x = -MAX_X;
      if (state.vx < 0) state.vx = 0;
    } else if (state.x > MAX_X) {
      state.x = MAX_X;
      if (state.vx > 0) state.vx = 0;
    }

    if (state.y < MIN_Y) {
      state.y = MIN_Y;
      if (state.vy < 0) state.vy = 0;
    } else if (state.y > MAX_Y) {
      state.y = MAX_Y;
      if (state.vy > 0) state.vy = 0;
    }
  }

  function constrainFlagMotion(flag) {
    flag.x = clamp(flag.x, -FLAG_MAX_X, FLAG_MAX_X);
    flag.y = clamp(flag.y, FLAG_MIN_Y, FLAG_MAX_Y);

    // flag.v* is a world-space velocity, while flag.{x,y} is relative to the
    // head. At a relative-position stop, kill only the velocity *through* the
    // stop. A free flag may still move together with the head.
    const relVx = flag.vx - state.vx;
    const relVy = flag.vy - state.vy;

    if ((flag.x <= -FLAG_MAX_X && relVx < 0) || (flag.x >= FLAG_MAX_X && relVx > 0)) {
      flag.vx = flag.dragging ? 0 : state.vx;
    }
    if ((flag.y <= FLAG_MIN_Y && relVy < 0) || (flag.y >= FLAG_MAX_Y && relVy > 0)) {
      flag.vy = flag.dragging ? 0 : state.vy;
    }
  }

  function isAnyDragging() {
    return state.dragTarget !== null;
  }

  function flagsEnabled() {
    return currentFlag === 'denmark';
  }

  function isFlagDragging() {
    return state.dragTarget === 'left' || state.dragTarget === 'right';
  }

  function softFlagOffset(nx, ny) {
    const yCenter = (FLAG_MIN_Y + FLAG_MAX_Y) / 2;
    const yHalf = (FLAG_MAX_Y - FLAG_MIN_Y) / 2;
    return {
      x: Math.tanh(nx / FLAG_MAX_X) * FLAG_MAX_X,
      y: yCenter + Math.tanh((ny - yCenter) / yHalf) * yHalf
    };
  }

  function flagWorldRest(flag) {
    return {
      x: flag.restX + state.x,
      y: flag.restY + state.y + HEAD_REST_Y
    };
  }

  function applyHeldFlag() {
    if (!isFlagDragging()) return;

    const flag = flags[state.dragTarget];
    const rest = flagWorldRest(flag);
    const held = softFlagOffset(state.holdX - rest.x, state.holdY - rest.y);
    flag.x = held.x;
    flag.y = held.y;
    flag.vx = 0;
    flag.vy = 0;
    constrainFlagMotion(flag);
  }

  function isQuiet(entity, posEps, velEps) {
    return Math.abs(entity.x) < posEps &&
      Math.abs(entity.y) < posEps &&
      Math.abs(entity.vx) < velEps &&
      Math.abs(entity.vy) < velEps;
  }

  function restIfSettled() {
    if (state.dragging || isFlagDragging()) return;

    const flagsAreQuiet = !flagsEnabled() || Object.values(flags).every((flag) => isQuiet(flag, 0.08, 0.9));
    if (!isQuiet(state, 0.12, 1.1) || !flagsAreQuiet) return;

    state.x = state.y = state.vx = state.vy = state.ax = state.ay = 0;
    if (flagsEnabled()) {
      Object.values(flags).forEach((flag) => {
        flag.x = flag.y = flag.vx = flag.vy = 0;
      });
    }
  }

  function updateHeadPose(dt) {
    const displayVx = state.vx;
    let target = (-state.x * 0.055) + (displayVx * 0.016);

    if (flagsEnabled()) {
      target += (flags.left.x - flags.right.x) * 0.075;
      target += (-flags.left.y + flags.right.y) * 0.05;
      target += (flags.left.vx - flags.right.vx) * 0.004;
    }

    target = clamp(target, -14, 14);
    const next = clamp(state.angle + (target - state.angle) * 0.18, -14, 14);
    const safeDt = Math.max(dt, 0.001);
    const omega = (next - state.angle) / safeDt;
    state.alpha = (omega - state.omega) / safeDt;
    state.omega = omega;
    state.angle = next;
  }

  function springPath(topX, topY, bottomX, bottomY, kink = 0) {
    // Hand-built spring curve made from cubic Bézier half-turns.
    const coils = 3;
    const amp = 44.2;
    const total = Math.max(18, bottomY - topY);
    const step = total / (coils * 2);
    let d = `M ${topX} ${topY}`;

    for (let i = 0; i < coils * 2; i++) {
      const t0 = i / (coils * 2);
      const t1 = (i + 1) / (coils * 2);
      const y0 = topY + total * t0;
      const y1 = topY + total * t1;
      const bow = Math.sin(Math.PI * t0) * kink;

      // Gradually shift the spring center from the head to the body.
      const cx0 = topX + (bottomX - topX) * t0 + bow;
      const cx1 = topX + (bottomX - topX) * t1 + Math.sin(Math.PI * t1) * kink;
      const side = (i % 2 === 0) ? 1 : -1;

      const x1 = cx1 + side * amp;
      const c1x = cx0 + side * amp * 0.75;
      const c2x = cx1 + side * amp * 1.08;

      d += ` C ${c1x} ${y0 + step * .25}, ${c2x} ${y1 - step * .25}, ${x1} ${y1}`;
    }

    d += ` C ${bottomX} ${bottomY - 4}, ${bottomX} ${bottomY - 2}, ${bottomX} ${bottomY}`;
    return d;
  }

  function miniSpringPath(ax, ay, bx, by) {
    const dx = bx - ax;
    const dy = by - ay;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len;
    const uy = dy / len;
    const px = -uy;
    const py = ux;
    const headPad = 5.5;
    const tailPad = 2.2;
    const sx = ax + ux * headPad;
    const sy = ay + uy * headPad;
    const ex = bx - ux * tailPad;
    const ey = by - uy * tailPad;
    const coils = 18;
    const amp = 3.8;

    let d = `M ${ax} ${ay} L ${sx} ${sy}`;
    for (let i = 1; i < coils; i++) {
      const t = i / coils;
      const x = sx + (ex - sx) * t;
      const y = sy + (ey - sy) * t;
      const side = i % 2 === 0 ? -1 : 1;
      d += ` L ${x + px * amp * side} ${y + py * amp * side}`;
    }
    d += ` L ${ex} ${ey} L ${bx} ${by}`;
    return d;
  }

  function render() {
    headGroup.setAttribute(
      'transform',
      `translate(${state.x} ${state.y + HEAD_REST_Y}) rotate(${state.angle} 200 ${255 + HEAD_REST_Y})`
    );

    let topX = headAnchor.x + state.x;
    let topY = headAnchor.y + state.y + HEAD_REST_Y;
    let kink = state.angle * 1.15;

    if (flagsEnabled()) {
      topX += (flags.left.x + flags.right.x) * 0.2 + state.angle * 0.9;
      topY += (flags.left.y + flags.right.y) * 0.1;
      kink += (flags.left.x - flags.right.x) * 0.55;
      kink += (flags.left.y - flags.right.y) * 0.35;
      kink += state.omega * 0.012;
    }

    const path = springPath(topX, topY + SPRING_TOP_OFFSET, bodyAnchor.x, bodyAnchor.y, kink);
    spring.setAttribute('d', path);
    springBack.setAttribute('d', path);

    const distance = Math.hypot(state.x * .45, state.y * .35);
    const scale = clamp(1 - distance / 620, .76, 1);
    shadow.setAttribute('rx', 90 * scale);
    shadow.setAttribute('opacity', clamp(.13 - Math.max(-state.y, 0) / 1300, .055, .14));

    if (flagsEnabled()) {
      Object.values(flags).forEach((flag) => {
        const pivotX = flag.restX + flag.x;
        const pivotY = flag.restY + flag.y;
        flag.angle = springToFlagAngle(flag.anchorX, flag.anchorY, pivotX, pivotY);

        flag.translate.setAttribute('transform', `translate(${pivotX} ${pivotY})`);
        flag.group.setAttribute('transform', `rotate(${flag.angle}) scale(1.2)`);

        const d = miniSpringPath(flag.anchorX, flag.anchorY, pivotX, pivotY);
        flag.spring.setAttribute('d', d);
        flag.springBack.setAttribute('d', d);
      });
    }
  }

  function integrateSystem(dt) {
    // Force on the head from the body spring.
    let headFx = -KX * state.x - DAMP_X * state.vx;
    let headFy = -KY * state.y - DAMP_Y * state.vy;

    const freeFlagAccelerations = [];

    if (flagsEnabled()) {
      Object.values(flags).forEach((flag) => {
        // The mini spring is between a moving head endpoint and the flag.
        // q = flag.{x,y} is its extension from the rest configuration.
        // Relative endpoint velocity must therefore be v_flag - v_head.
        const relVx = flag.vx - state.vx;
        const relVy = flag.vy - state.vy;

        const fxOnFlag = -FLAG_KX * flag.x - FLAG_DAMP_X * relVx;
        const fyOnFlag = -FLAG_KY * flag.y - FLAG_DAMP_Y * relVy;

        // Newton's third law: the head receives the exact opposite force.
        headFx -= fxOnFlag;
        headFy -= fyOnFlag;

        freeFlagAccelerations.push({
          flag,
          ax: flag.dragging ? 0 : fxOnFlag / FLAG_MASS,
          ay: flag.dragging ? 0 : fyOnFlag / FLAG_MASS
        });
      });
    }

    if (state.dragging) {
      // A grabbed head is a kinematic constraint. It has no physical velocity
      // or acceleration; pointer velocity is kept only in throwV*.
      state.vx = 0;
      state.vy = 0;
      state.ax = 0;
      state.ay = 0;
    } else {
      state.ax = headFx / HEAD_MASS;
      state.ay = headFy / HEAD_MASS;
      state.vx += state.ax * dt;
      state.vy += state.ay * dt;
    }

    freeFlagAccelerations.forEach(({ flag, ax, ay }) => {
      if (flag.dragging) {
        // The grabbed flag endpoint is fixed in world space.
        flag.vx = 0;
        flag.vy = 0;
      } else {
        flag.vx += ax * dt;
        flag.vy += ay * dt;
      }
    });

    if (!state.dragging) {
      state.x += state.vx * dt;
      state.y += state.vy * dt;
      constrainMotion();
    }

    if (flagsEnabled()) {
      freeFlagAccelerations.forEach(({ flag }) => {
        if (flag.dragging) return;

        // flag.{x,y} is relative to the head, so qdot = v_flag - v_head.
        flag.x += (flag.vx - state.vx) * dt;
        flag.y += (flag.vy - state.vy) * dt;
        constrainFlagMotion(flag);
      });

      // If a flag is held while the head moved during this substep, update its
      // relative coordinate so the held flag endpoint stays fixed in world space.
      applyHeldFlag();
    }
  }

  function physics(now) {
    const frameDt = Math.min(Math.max((now - lastFrame) / 1000, 0), MAX_FRAME_DT);
    lastFrame = now;
    physicsAccumulator += frameDt;

    while (physicsAccumulator >= PHYSICS_DT) {
      applyHeldFlag();
      integrateSystem(PHYSICS_DT);
      physicsAccumulator -= PHYSICS_DT;
    }

    updateHeadPose(frameDt);
    restIfSettled();
    render();
    requestAnimationFrame(physics);
  }

  function beginDrag(e) {
    e.preventDefault();
    const p = screenToSvg(e.clientX, e.clientY);

    state.dragging = true;
    state.dragTarget = 'head';
    state.pointerId = e.pointerId;
    state.grabOffsetX = p.x - (200 + state.x);
    state.grabOffsetY = p.y - (220 + state.y + HEAD_REST_Y);
    state.lastPX = p.x;
    state.lastPY = p.y;
    state.lastT = performance.now();
    state.vx = 0;
    state.vy = 0;
    state.ax = 0;
    state.ay = 0;
    state.throwVx = 0;
    state.throwVy = 0;
    state._prevThrowVx = 0;
    state._prevThrowVy = 0;

    headHit.classList.add('dragging');
    headHit.setPointerCapture(e.pointerId);
  }

  function beginFlagDrag(side, e) {
    if (!flagsEnabled()) return;

    e.preventDefault();
    const p = screenToSvg(e.clientX, e.clientY);
    const flag = flags[side];
    const rest = flagWorldRest(flag);
    const worldX = rest.x + flag.x;
    const worldY = rest.y + flag.y;

    state.dragging = false;
    state.dragTarget = side;
    state.pointerId = e.pointerId;
    state.grabOffsetX = p.x - worldX;
    state.grabOffsetY = p.y - worldY;
    state.holdX = worldX;
    state.holdY = worldY;
    state.lastPX = worldX;
    state.lastPY = worldY;
    state.lastT = performance.now();

    flag.dragging = true;
    flag.vx = flag.vy = flag.throwVx = flag.throwVy = 0;
    flag.hit.classList.add('dragging');
    flag.hit.setPointerCapture(e.pointerId);
  }

  function moveDrag(e) {
    if (!state.dragTarget || e.pointerId !== state.pointerId) return;
    e.preventDefault();

    const now = performance.now();
    const dt = Math.max((now - state.lastT) / 1000, 0.008);

    if (state.dragTarget === 'head') {
      const p = screenToSvg(e.clientX, e.clientY);
      let nx = p.x - state.grabOffsetX - 200;
      let ny = p.y - state.grabOffsetY - 220 - HEAD_REST_Y;

      // Soft resistance near the limits instead of a hard wall.
      nx = Math.tanh(nx / MAX_X) * MAX_X;
      const yCenter = (MIN_Y + MAX_Y) / 2;
      const yHalf = (MAX_Y - MIN_Y) / 2;
      ny = yCenter + Math.tanh((ny - yCenter) / yHalf) * yHalf;

      const instVx = (nx - state.x) / dt;
      const instVy = (ny - state.y) / dt;

      state.throwVx = state.throwVx * .62 + instVx * .38;
      state.throwVy = state.throwVy * .62 + instVy * .38;

      const oldX = state.x;
      const oldY = state.y;
      state.vx = 0;
      state.vy = 0;
      state.ax = 0;
      state.ay = 0;
      state.x = nx;
      state.y = ny;
      constrainMotion();

      // Moving a grabbed head is a kinematic position change, not a hidden
      // velocity impulse. Preserve each free flag's world position at the
      // instant of the pointer move; the springs then respond normally.
      if (flagsEnabled()) {
        const dx = state.x - oldX;
        const dy = state.y - oldY;
        Object.values(flags).forEach((flag) => {
          if (flag.dragging) return;
          flag.x -= dx;
          flag.y -= dy;
          constrainFlagMotion(flag);
        });
      }

      state.lastPX = p.x;
      state.lastPY = p.y;
      state.lastT = now;
      return;
    }

    const flag = flags[state.dragTarget];
    if (!flag) return;

    const p = screenToSvg(e.clientX, e.clientY);
    const holdX = p.x - state.grabOffsetX;
    const holdY = p.y - state.grabOffsetY;
    const instVx = (holdX - state.holdX) / dt;
    const instVy = (holdY - state.holdY) / dt;

    flag.throwVx = flag.throwVx * .62 + instVx * .38;
    flag.throwVy = flag.throwVy * .62 + instVy * .38;
    state.holdX = holdX;
    state.holdY = holdY;
    applyHeldFlag();

    state.lastPX = holdX;
    state.lastPY = holdY;
    state.lastT = now;
  }

  function endDrag(e) {
    if (!state.dragTarget || e.pointerId !== state.pointerId) return;
    e.preventDefault();

    if (state.dragTarget === 'head') {
      state.dragging = false;
      state.pointerId = null;
      state.dragTarget = null;
      headHit.classList.remove('dragging');

      // Clamp throw speed to avoid numerical explosions from fast touch events.
      state.vx = clamp(state.throwVx, -950, 950);
      state.vy = clamp(state.throwVy, -1100, 1100);
      state.throwVx = 0;
      state.throwVy = 0;
      state._prevThrowVx = 0;
      state._prevThrowVy = 0;
      return;
    }

    const flag = flags[state.dragTarget];
    if (!flag) return;

    flag.dragging = false;
    flag.hit.classList.remove('dragging');

    // throwV* is the pointer/flag WORLD velocity. Do not subtract the head
    // velocity here; the spring damper uses (v_flag - v_head) itself.
    flag.vx = clamp(flag.throwVx, -620, 620);
    flag.vy = clamp(flag.throwVy, -720, 720);
    flag.throwVx = 0;
    flag.throwVy = 0;

    // No manual kick is applied to the head. Any motion transfer now comes
    // only through the equal-and-opposite spring force in integrateSystem().
    state.dragging = false;
    state.pointerId = null;
    state.dragTarget = null;
  }

  headHit.addEventListener('pointerdown', beginDrag);
  flagEls.left.hit.addEventListener('pointerdown', (e) => beginFlagDrag('left', e));
  flagEls.right.hit.addEventListener('pointerdown', (e) => beginFlagDrag('right', e));
  svg.addEventListener('pointermove', moveDrag);
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);

  settingsButton.addEventListener('click', (e) => {
    e.stopPropagation();
    togglePanel();
  });

  settingsPanel.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
  });

  document.addEventListener('pointerdown', (e) => {
    if (!settingsPanel.classList.contains('open')) return;
    if (settingsPanel.contains(e.target) || settingsButton.contains(e.target)) return;
    togglePanel(false);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && settingsPanel.classList.contains('open')) {
      togglePanel(false);
      settingsButton.focus();
    }
  });

  // Prevent page gestures while manipulating the toy.
  document.addEventListener('touchmove', (e) => {
    if (isAnyDragging()) e.preventDefault();
  }, { passive: false });

  buildSwatches();
  buildFlagOptions();
  setTheme(localStorage.getItem(STORAGE_KEY) || 'mizuiro');
  setFlag(localStorage.getItem(FLAG_STORAGE_KEY) || 'none');
  render();
  requestAnimationFrame(physics);
})();
</script>
</body>
</html>
